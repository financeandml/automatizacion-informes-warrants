[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "informes-warrants"
version = "0.1.0"
description = "Automatización de informes sobre empresas cotizadas en EEUU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "edgartools>=5.61.1,<6",  # la 6.0 cambia la API (None → excepciones)
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "markdown>=3.6",          # textos Markdown del editor → HTML del informe
    "matplotlib>=3.9",        # gráficos vectoriales (SVG) del PDF
    "jinja2>=3.1",
    "openai>=1.40",           # cliente común para Groq, Ollama y demás APIs compatibles
    "platformdirs>=4",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",       # precios y tipos de cambio (fuente de mercado de edgar_analytics)
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]  # en Windows necesita GTK (ver README)
ui = ["streamlit>=1.38"]   # interfaz del analista (A12): `informes-warrants interfaz`
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
informes-warrants = "informes_warrants.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/informes_warrants"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["red: necesita conexión (SEC o modelo de lenguaje); se excluye con -m 'not red'"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
